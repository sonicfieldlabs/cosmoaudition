version: 1
updated_at: "2026-07-29"
preflight_timezone: "America/Bogota"
project: "Cosmoaudition System"
policy:
  no_api_keys_required_for_mvp: true
  no_automatic_geolocation: true
  no_client_fingerprinting_persistence: true
  network_route_default: "api-proxy"
  null_value_rule: "Missing or invalid values must remain null; adapters must not invent replacement measurements."

sources:
  - id: carbon_intensity_gb
    label: "Carbon Intensity GB"
    status: ready
    layers: [earth, cloud]
    endpoint: "https://api.carbonintensity.org.uk/intensity"
    route: api-proxy
    ttl_seconds: 1800
    unit: "gCO2/kWh"
    parser: "JSON data[0].intensity.actual, data[0].intensity.forecast, data[0].intensity.index"
    primary_signals:
      - carbon_intensity_actual
      - carbon_intensity_forecast
      - carbon_intensity_index
    preflight:
      checked_at: "2026-06-26"
      http_status: 200
      latency_seconds: 0.807
      bytes: 191
    confidence_rules:
      high: "actual exists and timestamp is inside ttl"
      medium: "forecast exists but actual is null"
      stale: "cached value older than ttl"
      error: "network, validation, or timestamp failure"
    fallback: "Use last-known-good cache as stale; otherwise emit null-valued signal and quiet staleNoise."
    limitation: "Great Britain grid data only; must not be presented as global carbon intensity."
    license_note: "Public API; record provider attribution in UI/docs."

