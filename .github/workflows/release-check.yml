# Portable PR checks run once; full platform qualification is deliberate.
name: Release check

on:
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      full:
        description: Run complete platform and release qualification (prefer local execution)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Record Node.js runtime
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: inputs.full == true
        run: pnpm exec playwright install --with-deps chromium

      - name: Run portable checks
        if: inputs.full != true
        run: pnpm typecheck && pnpm test

      - name: Run the complete release gate
        if: inputs.full == true
        run: pnpm release:check

      - name: Audit all dependency scopes
        run: pnpm audit --audit-level=low
